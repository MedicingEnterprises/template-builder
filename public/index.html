<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Builder</title>
    
    <!-- Tailwind CSS via CDN (No need to download) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jsPDF via CDN (No need to download) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">Template Builder</h1>
        
        <div class="mb-4">
            <input type="text" id="fieldName" class="border p-2 w-full" placeholder="Enter field name">
            <button onclick="addField()" class="bg-blue-500 text-white px-4 py-2 mt-2 rounded">Add Field</button>
            <button onclick="saveTemplate()" class="bg-green-500 text-white px-4 py-2 mt-2 rounded">Save Template</button>
            <button onclick="loadTemplate()" class="bg-yellow-500 text-white px-4 py-2 mt-2 rounded">Load Template</button>
        </div>

        <div id="fieldsContainer" class="space-y-2"></div>

        <button onclick="generatePDF()" class="bg-red-500 text-white px-4 py-2 mt-4 rounded">Download as PDF</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
